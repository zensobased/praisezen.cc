.page-actions {
  position: fixed;
  right: 15px;
  bottom: 15px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.page-btn {
  display: grid;
  place-items: center;
  width: 60px;
  height: 60px;
  border-radius: 15px;
  border: 2px solid rgba(6, 7, 6, 0.235);
  background: rgba(6, 7, 6, 0.26);
  color: var(--fg);
  transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
}

.page-btn svg {
  width: 27px;
  height: 27px;
  display: block;
}

.page-btn:hover {
  background: rgba(20, 20, 20, 0.45);
  border-color: rgba(120, 120, 120, 0.25);
  transform: translateY(-1px);
}

.page-btn:active {
  transform: scale(0.95);
}
